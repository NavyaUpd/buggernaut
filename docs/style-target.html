<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIJLI · style target (room 1-1)</title>
<style>
  :root { --bg: #05070f; --ink: #e9eefc; --muted: #8fa3c7; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #05070f; --ink: #e9eefc; } }
  :root[data-theme="dark"] { --bg: #05070f; --ink: #e9eefc; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Trebuchet MS", "Segoe UI", sans-serif; overflow: hidden; }
  canvas { width: min(100vw, calc((100vh - 40px) * 16 / 9)); max-width: 100%; height: auto; aspect-ratio: 16 / 9; display: block; outline: none; }
  .keys { color: var(--muted); font-size: 13px; padding: 8px 12px; text-align: center; }
  .keys b { color: var(--ink); }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720" tabindex="0" aria-label="BIJLI room 1-1 playable style target"></canvas>
<div class="keys"><b>A/D</b> move &nbsp; <b>Space</b> jump &nbsp; <b>W/S</b> climb &nbsp; <b>hold E</b> at the sparking cable &nbsp; <b>R</b> restart &nbsp; <b>F</b> reduce flashing</div>
<script>
(() => {
'use strict';
const W = 1280, H = 720, T = 32, OY = 8, COLS = 40, ROWS = 22;
const cv = document.getElementById('c'); const ctx = cv.getContext('2d'); cv.focus();

// ================= ROOM 1-1 (from rooms.ts) =================
const MAP = [
'........................................','........................................','........................................',
'........................................','........................................','........................................',
'........................................','........................................','........................................',
'............X...........................','............|..........................E','............|..........................E',
'............|.................##########','............|.........L...ccc.##########','............|.................##########',
'............|.................##########','............|..........ccc....##########','............|.................##########',
'..P...###...|.................##########','########################################','########################################',
'########################################'];
const cell = (x, y) => (x < 0 || x >= COLS) ? '#' : (y < 0 || y >= ROWS ? '.' : MAP[y][x]);
const solid = (x, y) => cell(x, y) === '#';
const LAMP = { x: 22 * T + 16, y: 13 * T + 16 + OY, r: 7 * T };
const POLE = { x: 12 * T + 16, top: 9 * T + OY };
const GROUND_Y = 19 * T + OY;
const DOG = { x: 662, y: GROUND_Y };

let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const P = { ink: '#000', paper: '#fff', sky: '#9ed8ff', dot: '#7cc6f5', yellow: '#ffd400', orange: '#ff9f1c', red: '#ff3b30', blue: '#2f6bff',
  green: '#2ecc71', cyan: '#4ff0ff', magenta: '#ff3e9a', sodium: '#ffb347', arc: '#7fe3ff' };
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const ease = { outCubic: k => 1 - Math.pow(1 - k, 3), outBack: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); }, clamp: k => Math.max(0, Math.min(1, k)) };

// ================= drawing helpers =================
function inkLine(g, x1, y1, x2, y2, w = 3, col = P.ink, j = 1.6) {
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x1 + (rnd() - .5) * j, y1 + (rnd() - .5) * j);
  const n = Math.max(2, Math.floor(Math.hypot(x2 - x1, y2 - y1) / 18));
  for (let i = 1; i <= n; i++) { const t = i / n; g.lineTo(x1 + (x2 - x1) * t + (rnd() - .5) * j, y1 + (y2 - y1) * t + (rnd() - .5) * j); }
  g.stroke();
}
function sketchRect(g, x, y, w, h, col = '#5a6478', lw = 1.4) { for (let k = 0; k < 2; k++) { inkLine(g, x, y, x + w, y, lw, col, 2.4); inkLine(g, x, y, x, y + h, lw, col, 2.4); inkLine(g, x + w, y, x + w, y + h, lw, col, 2.4); inkLine(g, x, y + h, x + w, y + h, lw, col, 2.4); } }
function crayonFill(g, x, y, w, h, base, stroke, density = 0.6) {
  g.fillStyle = base; g.fillRect(x, y, w, h); g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.strokeStyle = stroke; g.lineWidth = 2;
  for (let i = -h; i < w; i += 5) { if (rnd() > density) continue; g.globalAlpha = 0.25 + rnd() * 0.35; g.beginPath(); g.moveTo(x + i, y + h + 2); g.lineTo(x + i + h + 4, y - 2); g.stroke(); }
  g.restore(); g.globalAlpha = 1;
}
function blobPath(g, cx, cy, r, t) {
  g.beginPath();
  for (let i = 0; i <= 80; i++) { const a = i / 80 * Math.PI * 2; const k = 1 + 0.035 * Math.sin(5 * a + t) + 0.02 * Math.sin(11 * a + 1.3 + t * .6);
    const x = cx + Math.cos(a) * r * k, y = cy + Math.sin(a) * r * k; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.closePath();
}
function blobPoint(cx, cy, r, a, t) { const k = 1 + 0.035 * Math.sin(5 * a + t) + 0.02 * Math.sin(11 * a + 1.3 + t * .6); return [cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k]; }

// ================= city layout (shared by every look) =================
const city = [];
(function () {
  let x = -80; while (x < W + 120) { const w = 70 + rnd() * 110, h = 160 + rnd() * 250; city.push({ x, w, h, layer: 0, tank: rnd() > .5, dish: rnd() > .6 }); x += w + 6 + rnd() * 20; }
  x = -100; while (x < W + 140) { const w = 90 + rnd() * 130, h = 90 + rnd() * 170; city.push({ x, w, h, layer: 1, tank: rnd() > .4, dish: rnd() > .5, laundry: rnd() > .5 }); x += w + 10 + rnd() * 30; }
  city.forEach(b => { b.top = GROUND_Y - b.h - (b.layer === 0 ? 60 : 0); b.windows = []; const cols = Math.floor(b.w / 22), rows = Math.floor(b.h / 30);
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) if (rnd() > .45) { const wy = b.top + 18 + j * 30; if (wy < GROUND_Y - 30) b.windows.push({ x: b.x + 10 + i * 22, y: wy, candle: rnd() > .9, ph: rnd() * 9 }); } });
})();
const candles = []; city.forEach(b => b.windows.forEach(w => { if (w.candle) candles.push({ ...w, layer: b.layer }); }));
const silWin = candles.find(c => c.layer === 1 && c.x > 500 && c.x < 1100) || candles[0];

// ================= REAL look: layered for depth =================
const skyC = mk(), farC = mk(W + 200), midC = mk(W + 200), levelC = mk(), fgC = mk(W + 300), cloudsC = mk(W * 2, 300), fogC = mk(W * 2, 160);
(function bakeReal() {
  let g = skyC.getContext('2d'); const sk = g.createLinearGradient(0, 0, 0, H); sk.addColorStop(0, '#070b18'); sk.addColorStop(0.55, '#141c36'); sk.addColorStop(1, '#232d50'); g.fillStyle = sk; g.fillRect(0, 0, W, H);
  // drifting storm clouds texture (tileable-ish)
  g = cloudsC.getContext('2d');
  for (let i = 0; i < 90; i++) { const x = rnd() * W * 2, y = 20 + rnd() * 200, rx = 80 + rnd() * 200, ry = 20 + rnd() * 50; const gr = g.createRadialGradient(x, y, 0, x, y, rx);
    gr.addColorStop(0, `rgba(44,56,94,${0.25 + rnd() * .25})`); gr.addColorStop(1, 'rgba(44,56,94,0)'); g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill(); }
  // fog texture
  g = fogC.getContext('2d'); for (let i = 0; i < 60; i++) { const x = rnd() * W * 2, y = 60 + rnd() * 60, r = 140 + rnd() * 160; const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(120,140,190,.05)'); gr.addColorStop(1, 'rgba(120,140,190,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
  // far + mid buildings (x offset +100 so parallax can slide)
  [[farC, 0, '#111933'], [midC, 1, '#19223f']].forEach(([c, layer, col]) => { const g = c.getContext('2d');
    city.filter(b => b.layer === layer).forEach(b => { const bx = b.x + 100; g.fillStyle = col; g.fillRect(bx, b.top, b.w, H);
      if (b.tank) { g.fillRect(bx + 12, b.top - 22, 26, 22); g.fillRect(bx + 16, b.top - 30, 18, 8); g.fillRect(bx + 14, b.top - 2, 3, 6); }
      if (b.dish) { g.beginPath(); g.ellipse(bx + b.w - 20, b.top - 8, 11, 6, -0.5, 0, 7); g.fill(); g.fillRect(bx + b.w - 21, b.top - 6, 2, 8); }
      g.fillStyle = 'rgba(255,255,255,.035)'; g.fillRect(bx, b.top, 3, H); // rim
      b.windows.forEach(w => { if (w.candle) return; g.fillStyle = 'rgba(30,40,70,.9)'; g.fillRect(w.x + 100, w.y, 10, 14); });
      if (b.laundry && layer === 1) { g.strokeStyle = '#0d1428'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(bx + 6, b.top + 30); g.lineTo(bx + b.w - 6, b.top + 36); g.stroke();
        for (let k = 0; k < 4; k++) { g.fillStyle = '#0d1428'; g.fillRect(bx + 14 + k * (b.w - 30) / 4, b.top + 32 + k, 12, 16); } } });
    if (layer === 1) { g.strokeStyle = 'rgba(8,11,22,.95)'; g.lineWidth = 2; for (let i = 0; i < 10; i++) { const y0 = 160 + rnd() * 150; g.beginPath(); g.moveTo(0, y0); g.quadraticCurveTo(W / 2 + 100, y0 + 40 + rnd() * 70, W + 200, y0 + (rnd() - .5) * 90); g.stroke(); } }
  });
  // level blocks
  g = levelC.getContext('2d');
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { if (!solid(x, y)) continue; const px = x * T, py = y * T + OY;
    const gr = g.createLinearGradient(0, py, 0, py + T); gr.addColorStop(0, '#2f3a58'); gr.addColorStop(1, '#232c46'); g.fillStyle = gr; g.fillRect(px, py, T, T);
    g.fillStyle = 'rgba(0,0,0,.22)'; if ((x + y) % 2) g.fillRect(px, py + T / 2, T, 1); g.fillRect(px + ((y % 2) ? 0 : 16), py, 1, T / 2);
    if (rnd() > .7) { g.fillStyle = 'rgba(80,120,90,.25)'; g.fillRect(px + rnd() * 20, py + rnd() * 20, 6, 4); } // moss
    if (!solid(x, y - 1)) { g.fillStyle = '#6d7ea3'; g.fillRect(px, py, T, 2); g.fillStyle = 'rgba(143,163,199,.22)'; g.fillRect(px, py + 2, T, 5); }
    if (!solid(x - 1, y)) { g.fillStyle = 'rgba(109,126,163,.5)'; g.fillRect(px, py, 2, T); }
    if (!solid(x + 1, y)) { g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(px + T - 3, py, 3, T); } }
  // foreground silhouettes: hanging gulmohar branch (top-left) + cable bundle + signboard (bottom-right)
  g = fgC.getContext('2d'); g.fillStyle = '#04060d'; g.strokeStyle = '#04060d';
  g.lineWidth = 9; g.beginPath(); g.moveTo(0, 30); g.quadraticCurveTo(130, 60, 220, 40); g.stroke(); g.lineWidth = 5; g.beginPath(); g.moveTo(120, 52); g.quadraticCurveTo(170, 110, 160, 150); g.stroke();
  for (let i = 0; i < 70; i++) { const t = rnd(); const bx = 20 + t * 200, by = 36 + Math.sin(t * 3) * 14 + rnd() * 90; g.beginPath(); g.ellipse(bx, by, 9 + rnd() * 6, 4 + rnd() * 3, rnd() * 3, 0, 7); g.fill(); }
  g.lineWidth = 4; [[60, 1.0], [80, 0.8], [96, 1.3]].forEach(([y, s]) => { g.beginPath(); g.moveTo(0, y); g.quadraticCurveTo(W / 2 + 150, y + 70 * s, W + 300, y - 10); g.stroke(); });
  g.fillRect(W + 140, H - 210, 14, 210); g.fillRect(W + 60, H - 250, 170, 70);
})();

// ================= COMIC look (full colour) =================
const comicC = mk(), sketchC = mk();
(function bakeComic() {
  const g = comicC.getContext('2d'); g.fillStyle = P.sky; g.fillRect(0, 0, W, H);
  g.fillStyle = P.dot; for (let y = 0; y < H; y += 12) for (let x = (y / 12) % 2 ? 6 : 0; x < W; x += 12) { g.beginPath(); g.arc(x, y, 1.2 + 2.2 * (y / H), 0, 7); g.fill(); }
  g.fillStyle = P.yellow; g.beginPath(); g.arc(1020, 120, 56, 0, 7); g.fill(); g.lineWidth = 4; g.strokeStyle = P.ink; g.stroke();
  g.lineWidth = 3; g.beginPath(); g.arc(1020, 128, 26, 0.2, Math.PI - 0.2); g.stroke(); g.fillStyle = P.ink; g.beginPath(); g.arc(1004, 108, 4, 0, 7); g.arc(1036, 108, 4, 0, 7); g.fill();
  [[110, 90], [330, 120], [560, 80], [760, 130], [1200, 90]].forEach(([cx, cy]) => { const parts = [[0, 0, 40], [34, 6, 30], [-32, 8, 28], [10, -18, 26]];
    g.fillStyle = '#fff'; parts.forEach(([dx, dy, r]) => { g.beginPath(); g.arc(cx + dx, cy + dy, r, 0, 7); g.fill(); });
    g.strokeStyle = P.blue; g.lineWidth = 3; parts.forEach(([dx, dy, r]) => { g.beginPath(); g.arc(cx + dx, cy + dy, r, Math.PI * 1.05, Math.PI * 1.95); g.stroke(); }); });
  const bcols = ['#ff7eb6', '#7ee0c3', '#ffd400', '#b69cff', '#ff9f1c', '#7cc6f5'];
  city.forEach((b, i) => { crayonFill(g, b.x, b.top, b.w, H - b.top, bcols[i % bcols.length], 'rgba(0,0,0,.25)', 0.35);
    inkLine(g, b.x, b.top, b.x + b.w, b.top); inkLine(g, b.x, b.top, b.x, H); inkLine(g, b.x + b.w, b.top, b.x + b.w, H);
    if (b.tank) { g.fillStyle = P.blue; g.fillRect(b.x + 12, b.top - 22, 26, 22); inkLine(g, b.x + 12, b.top - 22, b.x + 38, b.top - 22, 3); inkLine(g, b.x + 12, b.top - 22, b.x + 12, b.top); inkLine(g, b.x + 38, b.top - 22, b.x + 38, b.top); }
    b.windows.forEach(w => { g.fillStyle = P.yellow; g.fillRect(w.x, w.y, 10, 14); g.strokeStyle = P.ink; g.lineWidth = 2; g.strokeRect(w.x, w.y, 10, 14); });
    if (b.laundry) { const ly = b.top + 30; inkLine(g, b.x + 6, ly, b.x + b.w - 6, ly + 6, 2); for (let k = 0; k < 4; k++) { g.fillStyle = [P.red, P.green, P.magenta, P.blue][k]; const lx = b.x + 14 + k * (b.w - 30) / 4; g.fillRect(lx, ly + 2 + k, 12, 16); g.strokeStyle = P.ink; g.lineWidth = 2; g.strokeRect(lx, ly + 2 + k, 12, 16); } } });
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { if (!solid(x, y)) continue; const px = x * T, py = y * T + OY, wall = x >= 30 && y < 19;
    crayonFill(g, px, py, T, T, wall ? '#ff6b5b' : P.yellow, wall ? '#c2412f' : P.orange, 0.8);
    if (wall && (x + y) % 2 === 0) { g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 2; g.strokeRect(px + 3, py + 4, T - 6, T / 2 - 4); } }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { if (!solid(x, y)) continue; const px = x * T, py = y * T + OY;
    if (!solid(x, y - 1)) { g.fillStyle = P.green; g.fillRect(px, py - 2, T, 6); inkLine(g, px - 1, py - 2, px + T + 1, py - 2, 3.5); }
    if (!solid(x - 1, y)) inkLine(g, px, py - 2, px, py + T, 3.5); if (!solid(x + 1, y)) inkLine(g, px + T, py - 2, px + T, py + T, 3.5); }
})();
(function bakeSketch() { // Chinni's notebook page: ruled paper + pencil outlines (the "drawing in progress" stage)
  const g = sketchC.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#cfe0fb'; g.lineWidth = 1.5; for (let y = 40; y < H; y += 30) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.strokeStyle = '#ffb3b3'; g.lineWidth = 2; g.beginPath(); g.moveTo(96, 0); g.lineTo(96, H); g.stroke();
  city.forEach(b => { sketchRect(g, b.x, b.top, b.w, H - b.top); b.windows.forEach((w, i) => { if (i % 2) sketchRect(g, w.x, w.y, 10, 14, '#8a93a6', 1); }); });
  g.beginPath(); g.arc(1020, 120, 56, 0, 7); g.strokeStyle = '#5a6478'; g.lineWidth = 1.6; g.stroke();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { if (!solid(x, y)) continue; const px = x * T, py = y * T + OY;
    if (!solid(x, y - 1)) inkLine(g, px, py, px + T, py, 1.6, '#5a6478', 2.4); if (!solid(x - 1, y)) inkLine(g, px, py, px, py + T, 1.6, '#5a6478', 2.4); if (!solid(x + 1, y)) inkLine(g, px + T, py, px + T, py + T, 1.6, '#5a6478', 2.4); }
})();

// ================= state =================
const lg = mk().getContext('2d'), ct = mk().getContext('2d'), dk = mk().getContext('2d'), heroCv = mk(140, 120), hg = heroCv.getContext('2d');
const keys = {}; let reduceFlash = false;
const S = { t: 0, spliced: false, spliceHold: 0, beats: 0, pulse: -1, powerT: -1, powered: false, firstBloomSeen: false,
  peek: 0, bolt: null, flash: 0, nextBolt: 7, telegraph: 0, shake: 0, bubbles: [], stamps: [], sparks: [], splashes: [], drips: [], ripples: [], stars: [],
  done: false, doneT: 0, captions: [{ text: 'tonight the whole city went dark. except bijli.', t: 0, dur: 4.5 }], wasComic: false, idleT: 0, shakeOff: 0, wind: 0 };
const pl = { x: 2 * T + 16, y: GROUND_Y - 32, vx: 0, vy: 0, w: 22, h: 56, face: 1, ground: false, coyote: 0, buffer: 0, varJ: 0, climb: false, anim: 0, squash: 1, lean: 0 };
const puddles = [{ x: 150, w: 70 }, { x: 470, w: 90 }, { x: 760, w: 110 }, { x: 905, w: 50 }];

addEventListener('keydown', e => { const k = e.key.toLowerCase(); if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (!keys[k] && (k === ' ' || ((k === 'w' || k === 'arrowup') && !pl.climb))) pl.buffer = 0.12;
  if (k === 'r') reset(); if (k === 'f' && !keys[k]) reduceFlash = !reduceFlash; keys[k] = true; A.start(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const L = () => keys['a'] || keys['arrowleft'], R = () => keys['d'] || keys['arrowright'], U = () => keys['w'] || keys['arrowup'], D = () => keys['s'] || keys['arrowdown'];
const JUMPHELD = () => keys[' '] || ((keys['w'] || keys['arrowup']) && !pl.climb);
function reset() { Object.assign(S, { spliced: false, spliceHold: 0, beats: 0, pulse: -1, powerT: -1, powered: false, done: false, doneT: 0, bubbles: [], stamps: [] });
  Object.assign(pl, { x: 2 * T + 16, y: GROUND_Y - 32, vx: 0, vy: 0, climb: false }); }

// ================= audio =================
const A = (() => { let ac = null; const nb = (sec, brown) => { const b = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate), d = b.getChannelData(0); let l = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (brown) { l = (l + 0.02 * w) / 1.02; d[i] = l * 3.5; } else d[i] = w; } return b; };
  const env = (node, v, a, d, t0 = 0) => { const g = ac.createGain(), t = ac.currentTime + t0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); node.connect(g); g.connect(ac.destination); return g; };
  return {
    start() { if (ac) return; try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      const s = ac.createBufferSource(); s.buffer = nb(2); s.loop = true; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500; const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 450;
      const g = ac.createGain(); g.gain.value = 0.05; s.connect(lp).connect(hp).connect(g).connect(ac.destination); s.start(); },
    thunder() { if (!ac) return; const s = ac.createBufferSource(); s.buffer = nb(3, true); const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240; s.connect(lp); env(lp, 0.9, 0.05, 2.7); s.start(); },
    blip(f, d = 0.08, type = 'square', vol = 0.06, t0 = 0) { if (!ac) return; const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, ac.currentTime + t0); o.frequency.exponentialRampToValueAtTime(f * .6, ac.currentTime + t0 + d); env(o, vol, 0.005, d, t0); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + d + .05); },
